<!DOCTYPE html>
<html lang="it">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1769aa"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Mirror</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f7fc;
  color: #17365d;
}
header {
  background: #1769aa;
  color: white;
  padding: 25px;
  text-align: center;
}
main {
  padding: 25px;
  text-align: center;
}
.card {
  background: white;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 3px 12px #ccd8e5;
}
button {
  background: #1769aa;
  color: white;
  border: 0;
  padding: 14px 25px;
  border-radius: 10px;
  font-size: 16px;
}
</style>
</head>
<body>
<header>
<h1>Social Mirror</h1>
<p>La tua identità digitale</p>
</header>
<main>
<div class="card">
<h2>Benvenuto!</h2>
<p>Il tuo nuovo spazio social inizia qui.</p>
<button onclick="document.getElementById('registrazione').style.display='block'">
  Inizia
</button>

<div id="registrazione" style="display:none; padding:20px;">
  <h2>Crea il tuo profilo</h2>
  <input type="text" placeholder="Il tuo nome">
  <input type="email" placeholder="La tua email">
  <input type="password" placeholder="Crea una password">
  <button onclick="alert('Registrazione in preparazione!')">
    Registrati
  </button>
</div>
</div>
</main>
<script>
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll("button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      const output = document.getElementById("result");
      if (output) {
        output.textContent = "Social Mirror è attivo! Funzione in preparazione.";
      } else {
        alert("Social Mirror è attivo!");
      }
    });
  });
});
</script>
</body>
</html>
