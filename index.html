<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e9e5d8">
<title>Social Mirror</title>

<style>
:root {
  --cream: #f5f1e7;
  --sage: #9caf98;
  --forest: #385343;
  --gold: #c6a45b;
  --white: #ffffff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--cream);
  color: var(--forest);
}

header {
  background: var(--forest);
  color: white;
  text-align: center;
  padding: 22px;
}

header h1 {
  margin: 0;
  font-size: 27px;
  letter-spacing: 2px;
}

header p {
  margin-bottom: 0;
  color: #e5d5a8;
}

main {
  max-width: 650px;
  margin: auto;
  padding: 18px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px #0000000d;
}

h2 {
  color: var(--forest);
}

input, textarea {
  width: 100%;
  padding: 13px;
  margin: 7px 0;
  border: 1px solid #d8dfd4;
  border-radius: 10px;
  font-size: 15px;
}

button {
  background: var(--sage);
  color: white;
  border: none;
  padding: 13px 18px;
  border-radius: 10px;
  margin: 5px 3px;
  font-size: 15px;
  cursor: pointer;
}

button:hover {
  background: var(--forest);
}

.gold {
  background: var(--gold);
  color: #273b2e;
}

.secondary {
  background: #e9e5d8;
  color: var(--forest);
}

.hidden {
  display: none !important;
}

.user {
  padding: 12px;
  margin: 7px 0;
  background: var(--cream);
  border-radius: 10px;
  cursor: pointer;
}

.user:hover {
  background: #e1e8dc;
}

#messages {
  height: 250px;
  overflow-y: auto;
  background: var(--cream);
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 10px;
}

.message {
  background: white;
  padding: 10px;
  border-radius: 10px;
  margin: 7px 0;
  overflow-wrap: anywhere;
}

.mine {
  background: #dce8d9;
}

#status {
  font-size: 14px;
  color: var(--forest);
  margin: 10px 0;
}

footer {
  text-align: center;
  padding: 20px;
  color: #777;
  font-size: 12px;
}

</style>
</head>

<body>

<header>
  <h1>🌿 SOCIAL MIRROR</h1>
  <p>Incontra. Condividi. Comunica.</p>
</header>

<main>

<section id="welcome" class="card">
  <h2>Benvenuto su Social Mirror</h2>
  <p>Uno spazio per conoscere nuove persone e comunicare in privato.</p>
  <button onclick=">Entra</button>
</section>

<section id="auth" class="card hidden">
  <h2>Il tuo account</h2>

  <input id="name" placeholder="Il tuo nome">
  <input id="email" type="email" placeholder="La tua email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="register()">Crea account</button>
  <button onclick="login()">Accedi</button>
  <button class="gold" onclick="googleLogin()">
    Continua con Google
  </button>
</section>

<section id="dashboard" class="hidden">

  <div class="card">
    <h2>Il mio profilo</h2>
    <p id="welcomeUser"></p>
    <button class="secondary" onclick="logout()">Esci</button>
  </div>

  <div class="card">
    <h2>💬 Persone su Social Mirror</h2>
    <p>Scegli una persona per iniziare una chat privata.</p>
    <div id="usersList">Caricamento utenti...</div>
  </div>

  <div class="card hidden" id="chatCard">
    <h2 id="chatTitle">Chat privata</h2>

    <div id="messages"></div>

    <input id="messageInput"
           placeholder="Scrivi un messaggio...">

    <button onclick="sendMessage()">Invia</button>
    <button class="secondary" onclick="closeChat()">Chiudi chat</button>

    <hr>

    <h3>🎁 Regala qualcosa</h3>

    <button class="gold" onclick="sendGift('🌹 Rosa')">🌹 Rosa</button>
    <button class="gold" onclick="sendGift('❤️ Cuore')">❤️ Cuore</button>
    <button class="gold" onclick="sendGift('💎 Diamante')">💎 Diamante</button>
    <button class="gold" onclick="sendGift('💍 Gioiello')">💍 Gioiello</button>
  </div>

  <div class="card">
    <h2>⭐
